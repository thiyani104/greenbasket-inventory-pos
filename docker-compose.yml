# Local PostgreSQL for development:  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: greenbasket-db
    environment:
      POSTGRES_DB: greenbasket
      POSTGRES_USER: greenbasket
      POSTGRES_PASSWORD: ${DB_PASSWORD:-greenbasket}
    ports:
      - "5432:5432"
    volumes:
      - gb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenbasket -d greenbasket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gb_pgdata:
