spring:
  application:
    name: green-basket-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/greenbasket}
    username: ${DB_USER:greenbasket}
    password: ${DB_PASSWORD:greenbasket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # MUST be overridden in production (32+ characters). Generate one with:  openssl rand -base64 48
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  security:
    max-failed-attempts: 5
    lock-minutes: 15
    reset-token-minutes: 30
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  bootstrap:
    admin-username: admin
    # Used only when the users table is empty. The admin must change it at first login.
    admin-password: ${ADMIN_PASSWORD:Admin@1234}
